services:
  db:
    image: mysql:8.0
    container_name: url_db
    ports:
      - "3306:3306"
    environment:
       MYSQL_DATABASE: urlDB
       MYSQL_USER: bahaa
       MYSQL_PASSWORD: password
       MYSQL_ROOT_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
  
  redis:
    image: redis:7.0
    container_name: url_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data: